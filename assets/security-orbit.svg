<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Security in motion</title>
  <desc id="desc">Illustrated development loop from code through CI and security review to production, with a feedback path. Decorative animation, not live telemetry. Kali Linux, Parrot OS and Linux Mint are featured below.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101D"/><stop offset="1" stop-color="#10152B"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#24304B" stroke-opacity=".28"/></pattern>
  </defs>
  <style>
    text{font-family:Consolas,'Courier New',monospace}
    .heading{font-size:30px;font-weight:700;letter-spacing:1px;fill:#F1F7FF}
    .label{font-size:25px;font-weight:700;fill:#F1F7FF}
    .small{font-size:19px;fill:#9AADCA}
    .flow{stroke-dasharray:8 14;animation:travel 6s linear infinite}
    .signal{animation:breathe 8s ease-in-out infinite}
    .two{animation-delay:2s}.three{animation-delay:4s}.four{animation-delay:6s}
    @keyframes travel{to{stroke-dashoffset:-264}}
    @keyframes breathe{0%,45%,100%{opacity:.4}15%,28%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.signal{animation:none;opacity:1}}
  </style>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="416" rx="20" fill="url(#grid)" stroke="#263654" stroke-width="2"/>
  <text x="44" y="54" class="heading">04 // SECURITY IN MOTION</text>
  <text x="44" y="86" class="small">AUTOMATE THE CHECKS. UNDERSTAND THE FINDINGS.</text>
  <text x="1148" y="52" text-anchor="end" font-size="17" fill="#A277FF">ILLUSTRATED WORKFLOW</text>
  <path d="M45 106H1155" stroke="#263654"/>
  <path d="M270 188H350 M540 188H620 M810 188H890" stroke="#34435E" stroke-width="3"/>
  <path d="M270 188H350 M540 188H620 M810 188H890" class="flow" stroke="#22E6E3" stroke-width="3"/>
  <path d="M341 182L350 188L341 194 M611 182L620 188L611 194 M881 182L890 188L881 194" fill="none" stroke="#22E6E3" stroke-width="2"/>
  <path d="M985 238V280H175V238" fill="none" stroke="#34435E" stroke-width="2"/>
  <path d="M985 238V280H175V238" class="flow" fill="none" stroke="#A277FF" stroke-width="2"/>
  <rect x="418" y="265" width="324" height="29" rx="10" fill="#0A1020"/>
  <text x="580" y="285" text-anchor="middle" class="small">OBSERVE / REVIEW / IMPROVE</text>
  <g>
    <rect x="80" y="138" width="190" height="100" rx="15" fill="#0A1020" stroke="#22E6E3"/>
    <circle cx="103" cy="159" r="5" fill="#22E6E3" class="signal"/>
    <text x="128" y="167" class="label">CODE</text>
    <text x="100" y="203" class="small">C# / .NET</text>
    <text x="100" y="224" class="small">Version control</text>
    <rect x="350" y="138" width="190" height="100" rx="15" fill="#0A1020" stroke="#A277FF"/>
    <circle cx="373" cy="159" r="5" fill="#A277FF" class="signal two"/>
    <text x="398" y="167" class="label">CI</text>
    <text x="370" y="203" class="small">Build / Test</text>
    <text x="370" y="224" class="small">Docker</text>
    <rect x="620" y="138" width="190" height="100" rx="15" fill="#0A1020" stroke="#FFCC66"/>
    <circle cx="643" cy="159" r="5" fill="#FFCC66" class="signal three"/>
    <text x="668" y="167" class="label">SECURITY</text>
    <text x="640" y="203" class="small">Code / Packages</text>
    <text x="640" y="224" class="small">Image scanning</text>
    <rect x="890" y="138" width="190" height="100" rx="15" fill="#0A1020" stroke="#38F59D"/>
    <circle cx="913" cy="159" r="5" fill="#38F59D" class="signal four"/>
    <text x="938" y="167" class="label">RELEASE</text>
    <text x="910" y="203" class="small">Production</text>
    <text x="910" y="224" class="small">Health checks</text>
  </g>
  <path d="M45 316H1155" stroke="#263654"/>
  <text x="44" y="351" font-size="21" font-weight="700" fill="#22E6E3">LINUX WORKBENCH</text>
  <text x="310" y="351" font-size="21" fill="#F1F7FF">KALI LINUX</text>
  <text x="565" y="351" font-size="21" fill="#F1F7FF">PARROT OS</text>
  <text x="820" y="351" font-size="21" fill="#38F59D">LINUX MINT</text>
  <text x="44" y="389" class="small">KEEP LEARNING. KEEP SYSTEMS USEFUL. GIVE OLDER HARDWARE A SECOND LIFE.</text>
</svg>
